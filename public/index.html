<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gridiron - Football Scores</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --accent: #0078d4;
            --accent-hover: #005a9e;
            --favorite-bg: #1a2a3a;
            --favorite-border: #0078d4;
            --border-color: #333;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 20px; 
        }
        .dashboard { max-width: 1200px; margin: auto; }
        
        /* Header & Controls */
        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
            margin-top: 20px;
        }
        h1 { margin: 0; font-size: 1.8em; }
        .date-picker-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        input[type="date"] {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 5px;
            color-scheme: dark;
            font-family: inherit;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: background 0.2s;
        }
        .tab-btn:hover { background-color: #2a2a2a; }
        .tab-btn.active {
            background-color: var(--accent);
            border-color: var(--accent);
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        h2 { border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-top: 10px; font-size: 1.4em; }
        
        /* Grid & Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .card { background: var(--card-bg); padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .card.favorite { border: 1px solid var(--favorite-border); background-color: var(--favorite-bg); }
        .team { display: flex; justify-content: space-between; margin: 10px 0; align-items: center; }
        .team img { width: 30px; height: 30px; margin-right: 15px; object-fit: contain; }
        .team-info { display: flex; align-items: center; font-weight: 500; }
        .team-record { font-size: 0.85em; color: var(--text-muted); margin-left: 8px; font-weight: normal; }
        .score { font-weight: bold; font-size: 1.3em; }
        .status { font-size: 0.85em; color: var(--text-muted); text-align: center; margin-top: 10px; font-weight: 600; }
        .meta-info { 
            display: flex; 
            justify-content: space-between; 
            font-size: 0.8em; 
            color: var(--text-muted); 
            margin-top: 15px; 
            border-top: 1px solid var(--border-color); 
            padding-top: 10px;
        }
        .no-data { color: var(--text-muted); font-style: italic; }
    </style>
</head>
<body>

<div class="dashboard">
    <div id="scoreboard-container">
        
        <div class="header-controls">
            <h1>Gridiron</h1>
            <div class="date-picker-container">
                <label for="game-date">Select Date:</label>
                <input type="date" id="game-date">
            </div>
        </div>
        
        <div id="favorites-section">
            <h2>Favorites</h2>
            <div id="favorites-grid" class="grid"></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('nfl')" id="btn-nfl">NFL</button>
            <button class="tab-btn" onclick="switchTab('ncaa')" id="btn-ncaa">NCAA (FBS)</button>
        </div>

        <div id="tab-nfl" class="tab-content active">
            <div id="nfl-grid" class="grid"></div>
        </div>

        <div id="tab-ncaa" class="tab-content">
            <div id="ncaa-grid" class="grid"></div>
        </div>

    </div>
</div>

<script>
    const FAVORITE_TEAMS = ["Carolina Panthers", "Clemson Tigers"];
    let pollingInterval;
    
    const BASE_ENDPOINTS = {
        nfl: 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard',
        ncaa: 'https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80'
    };

    // Initialize Date Picker
    const dateInput = document.getElementById('game-date');
    const today = new Date();
    // Offset for local timezone formatting to ensure picker shows local date
    const offset = today.getTimezoneOffset() * 60000;
    const localISOTime = (new Date(today - offset)).toISOString().split('T')[0];
    dateInput.value = localISOTime;

    dateInput.addEventListener('change', (e) => {
        fetchScores(e.target.value);
    });

    function switchTab(tab) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(`tab-${tab}`).classList.add('active');
        document.getElementById(`btn-${tab}`).classList.add('active');
    }

    async function fetchScores(dateString = null) {
        let nflUrl = BASE_ENDPOINTS.nfl;
        let ncaaUrl = BASE_ENDPOINTS.ncaa;

        // Append date parameter if specific date is selected
        if (dateString) {
            const espnDate = dateString.replace(/-/g, '');
            nflUrl += `?dates=${espnDate}`;
            ncaaUrl += `&dates=${espnDate}`;
        }

        try {
            const [nflRes, ncaaRes] = await Promise.all([
                fetch(nflUrl),
                fetch(ncaaUrl)
            ]);
            
            const nflData = await nflRes.json();
            const ncaaData = await ncaaRes.json();
            
            renderGames(nflData.events || [], ncaaData.events || []);
        } catch (error) {
            console.error('Error fetching ESPN API data:', error);
        }
    }

    function createGameCard(game, isFavorite = false) {
        const comp = game.competitions[0];
        const home = comp.competitors.find(c => c.homeAway === 'home');
        const away = comp.competitors.find(c => c.homeAway === 'away');
        const status = game.status.type.detail;
        
        const getScore = (team) => team.score || '0';
        const getLogo = (team) => team.team.logo || '';
        
        const getRecord = (team) => {
            if (team.records && team.records.length > 0) {
                return `(${team.records[0].summary})`;
            }
            return '';
        };

        let tvNetwork = 'N/A';
        if (comp.broadcasts && comp.broadcasts.length > 0 && comp.broadcasts[0].names) {
            tvNetwork = comp.broadcasts[0].names.join(', ');
        }

        let oddsStr = 'N/A';
        if (comp.odds && comp.odds.length > 0) {
            const spread = comp.odds[0].details || '';
            const ou = comp.odds[0].overUnder ? `(O/U: ${comp.odds[0].overUnder})` : '';
            oddsStr = `${spread} ${ou}`.trim() || 'N/A';
        }
        
        return `
            <div class="card ${isFavorite ? 'favorite' : ''}">
                <div class="team">
                    <div class="team-info">
                        <img src="${getLogo(away)}" alt="${away.team.displayName}" onerror="this.style.display='none'">
                        <span>${away.team.displayName} <span class="team-record">${getRecord(away)}</span></span>
                    </div>
                    <span class="score">${getScore(away)}</span>
                </div>
                <div class="team">
                    <div class="team-info">
                        <img src="${getLogo(home)}" alt="${home.team.displayName}" onerror="this.style.display='none'">
                        <span>${home.team.displayName} <span class="team-record">${getRecord(home)}</span></span>
                    </div>
                    <span class="score">${getScore(home)}</span>
                </div>
                <div class="status">${status}</div>
                <div class="meta-info">
                    <span>📺 ${tvNetwork}</span>
                    <span>🎲 ${oddsStr}</span>
                </div>
            </div>
        `;
    }

    function renderGames(nflGames, ncaaGames) {
        const favoritesEl = document.getElementById('favorites-grid');
        const nflEl = document.getElementById('nfl-grid');
        const ncaaEl = document.getElementById('ncaa-grid');
        
        let favoritesHtml = '';
        let nflHtml = '';
        let ncaaHtml = '';

        const processGame = (game) => {
            const comp = game.competitions[0];
            const homeName = comp.competitors.find(c => c.homeAway === 'home').team.displayName;
            const awayName = comp.competitors.find(c => c.homeAway === 'away').team.displayName;
            
            if (FAVORITE_TEAMS.includes(homeName) || FAVORITE_TEAMS.includes(awayName)) {
                favoritesHtml += createGameCard(game, true);
                return null; 
            }
            return createGameCard(game, false);
        };

        nflGames.forEach(game => {
            const card = processGame(game);
            if (card) nflHtml += card;
        });

        ncaaGames.forEach(game => {
            const card = processGame(game);
            if (card) ncaaHtml += card;
        });

        favoritesEl.innerHTML = favoritesHtml || '<p class="no-data">No favorite teams scheduled on this date.</p>';
        nflEl.innerHTML = nflHtml || '<p class="no-data">No NFL games scheduled on this date.</p>';
        ncaaEl.innerHTML = ncaaHtml || '<p class="no-data">No NCAA games scheduled on this date.</p>';
    }

    function startPolling() {
        // Clear existing interval if date changes
        if (pollingInterval) clearInterval(pollingInterval);
        
        // Initial Fetch
        fetchScores(dateInput.value);
        
        // Poll every 60 seconds
        pollingInterval = setInterval(() => {
            fetchScores(dateInput.value);
        }, 60000);
    }

    // Initialize application
    startPolling();
</script>
</body>
</html>
