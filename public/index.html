<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gridiron - Premium Analytics</title>
    
    <!-- Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Teko:wght@500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* Premium Dark Mode Palette */
            --bg-color: #0b0e14;
            --card-bg: #151a23;
            --card-hover: #1b222d;
            
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --text-dark: #64748b;
            
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --accent-hover: #2563eb;
            
            --favorite-bg: linear-gradient(145deg, #1a2436 0%, #151a23 100%);
            --favorite-border: #3b82f6;
            --border-color: #262f3f;
            
            --glass-bg: rgba(21, 26, 35, 0.7);
            
            --font-main: 'Inter', system-ui, -apple-system, sans-serif;
            --font-display: 'Teko', sans-serif;
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body { 
            font-family: var(--font-main); 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            margin: 0; 
            padding: 0; 
            -webkit-font-smoothing: antialiased;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.04), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.04), transparent 25%);
        }

        .dashboard { 
            max-width: 1280px; 
            margin: 0 auto; 
            padding: 40px 24px; 
        }
        
        /* Header & Controls */
        .header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 24px;
            margin-bottom: 32px;
        }

        h1 { 
            margin: 0; 
            font-family: var(--font-display);
            font-size: 3.5em; 
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: linear-gradient(to right, #ffffff, #94a3b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .date-picker-container {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card-bg);
            padding: 8px 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .date-picker-container label {
            font-size: 0.85em;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="date"] {
            background-color: transparent;
            color: var(--text-main);
            border: none;
            padding: 4px 8px;
            color-scheme: dark;
            font-family: var(--font-main);
            font-weight: 500;
            font-size: 1em;
            outline: none;
            cursor: pointer;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.6;
            transition: var(--transition);
        }
        
        input[type="date"]::-webkit-calendar-picker-indicator:hover {
            opacity: 1;
        }

        /* Typography */
        h2 { 
            font-size: 1.25em; 
            font-weight: 700;
            color: var(--text-main);
            margin: 40px 0 20px 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        h2::before {
            content: '';
            display: block;
            width: 4px;
            height: 18px;
            background: var(--accent);
            border-radius: 2px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            background: var(--glass-bg);
            padding: 6px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            width: fit-content;
            backdrop-filter: blur(10px);
        }

        .tab-btn {
            background-color: transparent;
            color: var(--text-muted);
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            font-family: var(--font-main);
            transition: var(--transition);
        }

        .tab-btn:hover { 
            color: var(--text-main);
        }

        .tab-btn.active {
            background-color: var(--accent);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        .tab-content { display: none; animation: fadeIn 0.4s ease; }
        .tab-content.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Grid & Cards */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); 
            gap: 20px; 
            margin-bottom: 40px; 
        }

        .card { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 16px; 
            border: 1px solid var(--border-color); 
            display: flex; 
            flex-direction: column;
            transition: var(--transition);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: #3b4b6b;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            background: var(--card-hover);
        }

        .card.favorite { 
            background: var(--favorite-bg);
            border: 1px solid var(--favorite-border); 
        }
        
        .card.favorite::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--favorite-border);
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .team { 
            display: flex; 
            justify-content: space-between; 
            margin: 12px 0; 
            align-items: center; 
        }

        .team img { 
            width: 36px; 
            height: 36px; 
            margin-right: 16px; 
            object-fit: contain; 
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .team-info { 
            display: flex; 
            align-items: center; 
            font-weight: 600; 
            font-size: 1.05em;
            letter-spacing: -0.2px;
        }

        .team-record { 
            font-size: 0.75em; 
            color: var(--text-dark); 
            margin-left: 10px; 
            font-weight: 500; 
            letter-spacing: 0.5px;
        }

        .score { 
            font-family: var(--font-display);
            font-weight: 600; 
            font-size: 2.2em; 
            line-height: 1;
        }

        .status { 
            font-size: 0.8em; 
            color: var(--accent); 
            text-align: right; 
            margin-top: 12px; 
            font-weight: 700; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .meta-info { 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            font-size: 0.75em; 
            color: var(--text-muted); 
            margin-top: 16px; 
            border-top: 1px solid var(--border-color); 
            padding-top: 16px;
            font-weight: 600;
        }

        .meta-info span {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.03);
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .no-data { 
            color: var(--text-dark); 
            font-weight: 500;
            background: var(--glass-bg);
            padding: 30px;
            border-radius: 12px;
            border: 1px dashed var(--border-color);
            text-align: center;
            grid-column: 1 / -1;
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #262f3f; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3b4b6b; }
    </style>
</head>
<body>

<div class="dashboard">
    <div id="scoreboard-container">
        
        <div class="header-controls">
            <h1>Gridiron</h1>
            <div class="date-picker-container">
                <label for="game-date">Select Date:</label>
                <input type="date" id="game-date">
            </div>
        </div>
        
        <div id="favorites-section">
            <h2>Favorites</h2>
            <div id="favorites-grid" class="grid"></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('nfl')" id="btn-nfl">NFL</button>
            <button class="tab-btn" onclick="switchTab('ncaa')" id="btn-ncaa">NCAA (FBS)</button>
        </div>

        <div id="tab-nfl" class="tab-content active">
            <div id="nfl-grid" class="grid"></div>
        </div>

        <div id="tab-ncaa" class="tab-content">
            <div id="ncaa-grid" class="grid"></div>
        </div>

    </div>
</div>

<script>
    const FAVORITE_TEAMS = ["Carolina Panthers", "Clemson Tigers"];
    let pollingInterval;
    
    const BASE_ENDPOINTS = {
        nfl: 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard',
        ncaa: 'https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard?groups=80'
    };

    // Initialize Date Picker
    const dateInput = document.getElementById('game-date');
    const today = new Date();
    // Offset for local timezone formatting to ensure picker shows local date
    const offset = today.getTimezoneOffset() * 60000;
    const localISOTime = (new Date(today - offset)).toISOString().split('T')[0];
    dateInput.value = localISOTime;

    dateInput.addEventListener('change', (e) => {
        fetchScores(e.target.value);
    });

    function switchTab(tab) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        
        document.getElementById(`tab-${tab}`).classList.add('active');
        document.getElementById(`btn-${tab}`).classList.add('active');
    }

    async function fetchScores(dateString = null) {
        let nflUrl = BASE_ENDPOINTS.nfl;
        let ncaaUrl = BASE_ENDPOINTS.ncaa;

        // Append date parameter if specific date is selected
        if (dateString) {
            const espnDate = dateString.replace(/-/g, '');
            nflUrl += `?dates=${espnDate}`;
            ncaaUrl += `&dates=${espnDate}`;
        }

        try {
            const [nflRes, ncaaRes] = await Promise.all([
                fetch(nflUrl),
                fetch(ncaaUrl)
            ]);
            
            const nflData = await nflRes.json();
            const ncaaData = await ncaaRes.json();
            
            renderGames(nflData.events || [], ncaaData.events || []);
        } catch (error) {
            console.error('Error fetching ESPN API data:', error);
        }
    }

    function createGameCard(game, isFavorite = false) {
        const comp = game.competitions[0];
        const home = comp.competitors.find(c => c.homeAway === 'home');
        const away = comp.competitors.find(c => c.homeAway === 'away');
        const status = game.status.type.detail;
        
        const getScore = (team) => team.score || '0';
        const getLogo = (team) => team.team.logo || '';
        
        const getRecord = (team) => {
            if (team.records && team.records.length > 0) {
                return `(${team.records[0].summary})`;
            }
            return '';
        };

        let tvNetwork = 'N/A';
        if (comp.broadcasts && comp.broadcasts.length > 0 && comp.broadcasts[0].names) {
            tvNetwork = comp.broadcasts[0].names.join(', ');
        }

        let oddsStr = 'N/A';
        if (comp.odds && comp.odds.length > 0) {
            const spread = comp.odds[0].details || '';
            const ou = comp.odds[0].overUnder ? `(O/U: ${comp.odds[0].overUnder})` : '';
            oddsStr = `${spread} ${ou}`.trim() || 'N/A';
        }
        
        return `
            <div class="card ${isFavorite ? 'favorite' : ''}">
                <div class="team">
                    <div class="team-info">
                        <img src="${getLogo(away)}" alt="${away.team.displayName}" onerror="this.style.display='none'">
                        <span>${away.team.displayName} <span class="team-record">${getRecord(away)}</span></span>
                    </div>
                    <span class="score">${getScore(away)}</span>
                </div>
                <div class="team">
                    <div class="team-info">
                        <img src="${getLogo(home)}" alt="${home.team.displayName}" onerror="this.style.display='none'">
                        <span>${home.team.displayName} <span class="team-record">${getRecord(home)}</span></span>
                    </div>
                    <span class="score">${getScore(home)}</span>
                </div>
                <div class="status">${status}</div>
                <div class="meta-info">
                    <span>📺 ${tvNetwork}</span>
                    <span>🎲 ${oddsStr}</span>
                </div>
            </div>
        `;
    }

    function renderGames(nflGames, ncaaGames) {
        const favoritesEl = document.getElementById('favorites-grid');
        const nflEl = document.getElementById('nfl-grid');
        const ncaaEl = document.getElementById('ncaa-grid');
        
        let favoritesHtml = '';
        let nflHtml = '';
        let ncaaHtml = '';

        const processGame = (game) => {
            const comp = game.competitions[0];
            const homeName = comp.competitors.find(c => c.homeAway === 'home').team.displayName;
            const awayName = comp.competitors.find(c => c.homeAway === 'away').team.displayName;
            
            if (FAVORITE_TEAMS.includes(homeName) || FAVORITE_TEAMS.includes(awayName)) {
                favoritesHtml += createGameCard(game, true);
                return null; 
            }
            return createGameCard(game, false);
        };

        nflGames.forEach(game => {
            const card = processGame(game);
            if (card) nflHtml += card;
        });

        ncaaGames.forEach(game => {
            const card = processGame(game);
            if (card) ncaaHtml += card;
        });

        favoritesEl.innerHTML = favoritesHtml || '<p class="no-data">No favorite teams scheduled on this date.</p>';
        nflEl.innerHTML = nflHtml || '<p class="no-data">No NFL games scheduled on this date.</p>';
        ncaaEl.innerHTML = ncaaHtml || '<p class="no-data">No NCAA games scheduled on this date.</p>';
    }

    function startPolling() {
        if (pollingInterval) clearInterval(pollingInterval);
        fetchScores(dateInput.value);
        pollingInterval = setInterval(() => {
            fetchScores(dateInput.value);
        }, 60000);
    }

    startPolling();
</script>
</body>
</html>
